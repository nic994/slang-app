  <body>
    <app-root>
      <style>
        html,
        body {
          height: 100%;
          margin: 0;
        }

        section {
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          background-color: #000;
        }

        .loader {
          display: flex;
          align-items: center;
        }

        .bar {
          display: inline-block;
          width: 3px;
          height: 20px;
          background-color: rgba(255, 255, 255, 0.5);
          border-radius: 10px;
          animation: scale-up4 1s linear infinite;
        }

        .bar:nth-child(2) {
          height: 35px;
          margin: 0 5px;
          animation-delay: 0.25s;
        }

        .bar:nth-child(3) {
          animation-delay: 0.5s;
        }

        @keyframes scale-up4 {
          20% {
            background-color: #fff;
            transform: scaleY(1.5);
          }
          40% {
            transform: scaleY(1);
          }
        }

        @media (max-width: 426px) {
          section {
            height: 94vh;
          }
        }
      </style>
      <section>
        <div class="loader">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </div>
      </section>
    </app-root>
  </body>
